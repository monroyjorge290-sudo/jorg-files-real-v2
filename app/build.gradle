
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jorg.files'
    compileSdk 34
    defaultConfig {
        applicationId "com.jorg.files"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0-Final"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
